name: Collecte quotidienne
on:
  schedule: [{cron: "0 4 * * *"}]   # 4h UTC = 5h ou 6h à Paris selon la saison
  workflow_dispatch:
permissions: {contents: write}
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r collector/requirements.txt
      - run: python collector/collect.py
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: |
          git config user.name "veille-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data/articles.json
          git diff --cached --quiet || (git commit -m "Mise à jour quotidienne" && git push)
